name: Build PC (Windows exe)
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build portable app
        run: gradle createDistributable --no-daemon --stacktrace
      - name: Build installer
        run: gradle packageExe --no-daemon
        continue-on-error: true
      - name: Zip portable
        shell: pwsh
        run: Compress-Archive -Path build/compose/binaries/main/app/Playlist -DestinationPath build/Playlist-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Playlist-PC-portable
          path: desktop/build/Playlist-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Playlist-PC-installer
          path: desktop/build/compose/binaries/main/exe/*.exe
          if-no-files-found: warn
