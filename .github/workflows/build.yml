name: Build APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - run: unzip -q YtPlaylistPlayer.zip
      - run: cd YtPlaylistPlayer && gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Playlist
          path: YtPlaylistPlayer/app/build/outputs/apk/release/app-release.apk
      # 압축 없이 APK를 바로 받을 수 있게 '최신' 릴리스에 올려요
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp YtPlaylistPlayer/app/build/outputs/apk/release/app-release.apk Playlist.apk
          gh release delete latest -y --cleanup-tag -R ${{ github.repository }} || true
          gh release create latest Playlist.apk -t "Playlist 최신 버전" -n "자동 빌드 ($(date -u +%Y-%m-%d))" --latest -R ${{ github.repository }}
